services:
  daep-api:
    build: .
    ports: ["8000:8000"]
    environment:
      DAEP_ADMIN_TOKEN: ${DAEP_ADMIN_TOKEN:?Set DAEP_ADMIN_TOKEN in .env}
      DAEP_DB_PATH: /data/daep.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes: ["daep-data:/data"]
    restart: unless-stopped
volumes:
  daep-data:
