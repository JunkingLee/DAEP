name: DAEP CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: daep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app daep_mcp daep_agent_bridge daep_worker
      - name: Validate Agent management JavaScript
        run: node --check web/agents.js
      - name: Validate dashboard JavaScript
        run: |
          python -c "from pathlib import Path; import re; s=Path('web/index.html').read_text(); m=re.search(r'<script>([\\s\\S]*?)</script>', s); assert m; Path('/tmp/daep-dashboard.js').write_text(m.group(1))"
          node --check /tmp/daep-dashboard.js
      - name: Tests
        env:
          DAEP_ADMIN_TOKEN: "ci-admin-token-abcdefghijklmnopqrstuvwxyz-012345"
          DAEP_WORKER_TOKEN: "ci-worker-token-abcdefghijklmnopqrstuvwxyz-678901"
        run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daep_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d daep_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap core schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
          DAEP_PRIVILEGED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
          DAEP_ADMIN_TOKEN: ${{ github.run_id }}-ci-admin-bootstrap-xxxxxxxxxxxxxxxxxxxx
        run: python -c "import app.main; app.main.bootstrap()"
      - name: Upgrade schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
        run: alembic upgrade head
      - name: Generate migration SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
        run: alembic upgrade head --sql > /tmp/daep-migrations.sql
      - name: Verify RLS policies
        env:
          PGPASSWORD: postgres
        run: |
          result=$(psql "host=127.0.0.1 port=5432 user=postgres dbname=daep_ci" -v ON_ERROR_STOP=1 -Atqc "
            SELECT
              (SELECT count(*) = 10 AND bool_and(c.relrowsecurity AND c.relforcerowsecurity)
               FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
               WHERE n.nspname='public' AND c.relname IN ('members','projects','events','artifacts','outbox','messages','project_agents','task_delegations','task_work_packages','project_approvals'))
              AND
              (SELECT count(*) = 10 FROM pg_policies
               WHERE schemaname='public' AND policyname IN
                 ('daep_members_tenant','daep_projects_tenant','daep_events_tenant','daep_artifacts_tenant','daep_outbox_tenant','daep_messages_tenant','daep_project_agents_tenant','daep_task_delegations_tenant','daep_task_work_packages_tenant','daep_project_approvals_tenant'))
              AND
              (SELECT count(*) = 0 FROM pg_policies
               WHERE schemaname='public' AND tablename='members' AND policyname='daep_members_auth_lookup')
              AND
              (SELECT count(*) = 1 FROM pg_proc WHERE proname='daep_authenticate_member' AND prosecdef)
              AND
              (SELECT count(*) = 5 FROM pg_policies
               WHERE schemaname='public' AND policyname IN
                 ('daep_requirements_tenant','daep_tasks_tenant','daep_project_members_tenant','daep_assignments_tenant','daep_dependencies_tenant'))
              AND
              (SELECT count(*) = 4 FROM pg_policies
               WHERE schemaname='public' AND policyname IN
                 ('daep_agents_tenant','daep_agent_tokens_tenant','daep_agent_project_bindings_tenant','daep_agent_task_assignments_tenant'))
              AND
              (SELECT count(*) = 4 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
               WHERE n.nspname='public' AND c.relname IN ('agents','agent_tokens','agent_project_bindings','agent_task_assignments') AND c.relrowsecurity AND c.relforcerowsecurity);
          ")
          test "$result" = "t"
          psql "host=127.0.0.1 port=5432 user=postgres dbname=daep_ci" -v ON_ERROR_STOP=1 -c "SELECT tablename, policyname, cmd FROM pg_policies WHERE schemaname='public' ORDER BY tablename, policyname;"

      - name: Verify tenant isolation as restricted database role
        env:
          PGPASSWORD: postgres
        run: |
          psql "host=127.0.0.1 port=5432 user=postgres dbname=daep_ci" -v ON_ERROR_STOP=1 -f tests/postgres_rls_smoke.sql

  production-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose rendering
        env:
          DAEP_POSTGRES_PASSWORD: "ci-postgres-password"
          DAEP_RUNTIME_DB_PASSWORD: "ci-runtime-password"
          DAEP_PRIVILEGED_DB_PASSWORD: "ci-privileged-password"
          DAEP_ADMIN_TOKEN: "ci-admin-token-abcdefghijklmnopqrstuvwxyz-012345"
          DAEP_WORKER_TOKEN: "ci-worker-token-abcdefghijklmnopqrstuvwxyz-678901"
        run: |
          docker compose -f compose.production.yaml config --quiet
          python scripts/verify_production_compose.py compose.production.yaml

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operational shell scripts
        run: |
          bash -n deploy/postgres/01-create-app-roles.sh
          bash -n scripts/backup_postgres.sh
          bash -n scripts/restore_postgres.sh
          bash -n scripts/verify_restored_postgres.sh
          python -m py_compile scripts/verify_production_compose.py
          bash -n scripts/production_smoke.sh
      - name: Build production container
        run: docker build --tag daep:rc24-ci .
      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect daep:rc24-ci --format '{{.Config.User}}')" = "daep"

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser-test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright==1.52.0"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run isolated Agent management browser E2E
        env:
          DAEP_RUN_BROWSER_E2E: "1"
        run: pytest -q tests/test_agent_management_e2e.py
