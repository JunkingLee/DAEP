name: DAEP CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: daep-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app daep_mcp daep_agent_bridge daep_worker
      - name: Tests
        env:
          DAEP_ADMIN_TOKEN: "ci-admin-token-abcdefghijklmnopqrstuvwxyz-012345"
          DAEP_WORKER_TOKEN: "ci-worker-token-abcdefghijklmnopqrstuvwxyz-678901"
        run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daep_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d daep_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap core schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
          DAEP_PRIVILEGED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
          DAEP_ADMIN_TOKEN: ${{ github.run_id }}-ci-admin-bootstrap-xxxxxxxxxxxxxxxxxxxx
        run: python -c "import app.main; app.main.bootstrap()"
      - name: Upgrade schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
        run: alembic upgrade head
      - name: Generate migration SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daep_ci
        run: alembic upgrade head --sql > /tmp/daep-migrations.sql
      - name: Verify RLS policies
        env:
          PGPASSWORD: postgres
        run: |
          result=$(psql "host=127.0.0.1 port=5432 user=postgres dbname=daep_ci" -v ON_ERROR_STOP=1 -Atqc "
            SELECT
              (SELECT count(*) = 8 AND bool_and(c.relrowsecurity AND c.relforcerowsecurity)
               FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
               WHERE n.nspname='public' AND c.relname IN ('members','projects','events','artifacts','outbox','messages','project_agents','task_delegations'))
              AND
              (SELECT count(*) = 8 FROM pg_policies
               WHERE schemaname='public' AND policyname IN
                 ('daep_members_tenant','daep_projects_tenant','daep_events_tenant','daep_artifacts_tenant','daep_outbox_tenant','daep_messages_tenant','daep_project_agents_tenant','daep_task_delegations_tenant'))
              AND
              (SELECT count(*) = 0 FROM pg_policies
               WHERE schemaname='public' AND tablename='members' AND policyname='daep_members_auth_lookup')
              AND
              (SELECT count(*) = 1 FROM pg_proc WHERE proname='daep_authenticate_member' AND prosecdef)
              AND
              (SELECT count(*) = 5 FROM pg_policies
               WHERE schemaname='public' AND policyname IN
                 ('daep_requirements_tenant','daep_tasks_tenant','daep_project_members_tenant','daep_assignments_tenant','daep_dependencies_tenant'));
          ")
          test "$result" = "t"
          psql "host=127.0.0.1 port=5432 user=postgres dbname=daep_ci" -v ON_ERROR_STOP=1 -c "SELECT tablename, policyname, cmd FROM pg_policies WHERE schemaname='public' ORDER BY tablename, policyname;"

      - name: Verify tenant isolation as restricted database role
        env:
          PGPASSWORD: postgres
        run: |
          psql "host=127.0.0.1 port=5432 user=postgres dbname=daep_ci" -v ON_ERROR_STOP=1 -f tests/postgres_rls_smoke.sql
