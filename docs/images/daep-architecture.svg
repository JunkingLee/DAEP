<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="t d">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset=".55" stop-color="#0d1b2e"/><stop offset="1" stop-color="#11182b"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".32"/></filter>
<style>.h{font:700 34px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 17px Inter,Arial,sans-serif;fill:#94a3b8}.l{font:700 17px Inter,Arial,sans-serif;fill:#e2e8f0}.sm{font:500 13px Inter,Arial,sans-serif;fill:#94a3b8}.tiny{font:700 12px Inter,Arial,sans-serif;fill:#7dd3fc}</style>
</defs>
<title id="t">DAEP Control Plane Architecture</title><desc id="d">Member-owned Agent environments connect through local MCP adapters to a DAEP control plane containing identity, authorization, work, collaboration, delivery and governance services.</desc>
<rect width="1600" height="860" rx="34" fill="url(#bg)"/>
<text x="72" y="78" class="h">DAEP · Control Plane Architecture</text>
<text x="72" y="112" class="sub">Member-owned execution on the left. Governed engineering state and accountability on the right.</text>

<g filter="url(#s)">
<rect x="72" y="170" width="420" height="570" rx="28" fill="#0b1728" stroke="#334b70" stroke-width="2"/>
<text x="108" y="215" class="l">MEMBER ENVIRONMENT</text><text x="108" y="242" class="tiny">EXECUTION BOUNDARY</text>
<rect x="108" y="280" width="348" height="108" rx="20" fill="#111f35" stroke="#2563eb"/><text x="136" y="320" class="l">Agent Runtime / Model</text><text x="136" y="348" class="sm">Local execution · state · tools</text><text x="136" y="370" class="sm">Owned and operated by the Member</text>
<rect x="108" y="410" width="348" height="108" rx="20" fill="#111f35" stroke="#7c3aed"/><text x="136" y="450" class="l">MCP Host + Local Tools</text><text x="136" y="478" class="sm">Files · processes · credentials</text><text x="136" y="500" class="sm">Outside DAEP's runtime boundary</text>
<rect x="108" y="540" width="348" height="150" rx="20" fill="#0f1d32" stroke="#06b6d4" stroke-width="2"/><text x="136" y="580" class="l">DAEP MCP Adapter</text><text x="136" y="610" class="sm">Local bridge → HTTPS → DAEP API</text><text x="136" y="635" class="sm">No runtime hosting / wake-up / scheduling</text>
</g>

<g filter="url(#s)">
<rect x="570" y="170" width="958" height="570" rx="28" fill="#091321" stroke="#334b70" stroke-width="2"/>
<text x="610" y="215" class="l">DAEP CONTROL PLANE</text><text x="610" y="242" class="tiny">GOVERNANCE + SYSTEM OF RECORD</text>
<g fill="#111f35" stroke="#334b70">
<rect x="610" y="280" width="200" height="96" rx="18"/><rect x="830" y="280" width="200" height="96" rx="18"/><rect x="1050" y="280" width="200" height="96" rx="18"/><rect x="1270" y="280" width="218" height="96" rx="18"/>
<rect x="610" y="398" width="200" height="96" rx="18"/><rect x="830" y="398" width="200" height="96" rx="18"/><rect x="1050" y="398" width="200" height="96" rx="18"/><rect x="1270" y="398" width="218" height="96" rx="18"/>
<rect x="610" y="516" width="200" height="96" rx="18"/><rect x="830" y="516" width="200" height="96" rx="18"/><rect x="1050" y="516" width="200" height="96" rx="18"/><rect x="1270" y="516" width="218" height="96" rx="18"/>
</g>
<g class="l"><text x="640" y="318">Identity</text><text x="860" y="318">Authorization</text><text x="1080" y="318">Projects</text><text x="1300" y="318">Requirements</text>
<text x="640" y="436">Tasks</text><text x="860" y="436">Collaboration</text><text x="1080" y="436">Messages</text><text x="1300" y="436">Work Packages</text>
<text x="640" y="554">Evidence</text><text x="860" y="554">Review / Acceptance</text><text x="1080" y="554">Governance / Audit</text><text x="1300" y="554">Outbox / RLS</text></g>
<g class="sm"><text x="640" y="346">Member · Tenant · OIDC</text><text x="860" y="346">Roles · Grants · Revocation</text><text x="1080" y="346">Engineering context</text><text x="1300" y="346">Intent + criteria</text>
<text x="640" y="464">Assignment · state</text><text x="860" y="464">Session · proposals</text><text x="1080" y="464">Inbox · ACK · retry</text><text x="1300" y="464">Governed Agent work</text>
<text x="640" y="582">Artifacts · commits</text><text x="860" y="582">Human decision</text><text x="1080" y="582">Policy · audit trail</text><text x="1300" y="582">Durable delivery · isolation</text></g>
</g></g>

<rect x="450" y="405" width="170" height="170" rx="28" fill="#0b1322" stroke="url(#accent)" stroke-width="3" stroke-dasharray="10 8"/>
<text x="485" y="455" class="l">BOUNDARY</text><text x="485" y="488" class="sm">HTTPS API</text><text x="485" y="514" class="sm">Adapter calls</text><text x="485" y="540" class="sm">DAEP REST API</text>
<path d="M492 590H570" stroke="#7dd3fc" stroke-width="4"/><path d="M570 580l18 10-18 10z" fill="#7dd3fc"/>
<rect x="72" y="780" width="1456" height="48" rx="16" fill="#111827" stroke="#334155"/>
<text x="100" y="811" class="sm">DAEP is the control plane and system of record for governed engineering work. It does not host or operate the Agent Runtime.</text>
</svg>