<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0d1b2e"/><stop offset="1" stop-color="#10152b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
  <style>
    .h{font:700 34px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:500 17px Inter,Arial,sans-serif;fill:#94a3b8}
    .label{font:700 18px Inter,Arial,sans-serif;fill:#e2e8f0}.small{font:500 14px Inter,Arial,sans-serif;fill:#94a3b8}
    .card{fill:#101e33;stroke:#263a57;stroke-width:1.5}.line{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<title id="t">DAEP Core Product Model</title><desc id="d">A governed engineering lifecycle from tenant and project through task, agent authorization, collaboration, evidence, acceptance and audit.</desc>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/>
<circle cx="1320" cy="110" r="230" fill="#2563eb" opacity=".08"/><circle cx="220" cy="790" r="280" fill="#7c3aed" opacity=".08"/>
<text x="80" y="82" class="h">DAEP · Core Product Model</text>
<text x="80" y="116" class="sub">A governed engineering system — from accountable work to verifiable acceptance</text>

<g filter="url(#shadow)">
<rect x="80" y="170" width="220" height="110" rx="20" class="card"/>
<text x="108" y="210" class="label">01 · CONTEXT</text><text x="108" y="242" class="small">Tenant / Organization</text><text x="108" y="264" class="small">Project</text>
<rect x="350" y="170" width="220" height="110" rx="20" class="card"/>
<text x="378" y="210" class="label">02 · INTENT</text><text x="378" y="242" class="small">Requirement</text><text x="378" y="264" class="small">Acceptance Criteria</text>
<rect x="620" y="170" width="220" height="110" rx="20" class="card"/>
<text x="648" y="210" class="label">03 · EXECUTION</text><text x="648" y="242" class="small">Task</text><text x="648" y="264" class="small">Work Packages</text>
<rect x="890" y="170" width="220" height="110" rx="20" class="card"/>
<text x="918" y="210" class="label">04 · COLLABORATION</text><text x="918" y="242" class="small">Agent Team</text><text x="918" y="264" class="small">Session / Messages</text>
<rect x="1160" y="170" width="220" height="110" rx="20" class="card"/>
<text x="1188" y="210" class="label">05 · DELIVERY</text><text x="1188" y="242" class="small">Artifacts</text><text x="1188" y="264" class="small">Evidence</text>
</g>
<path d="M300 225H350M570 225H620M840 225H890M1110 225H1160" class="line"/>

<g filter="url(#shadow)">
<rect x="250" y="390" width="1100" height="190" rx="28" fill="#0b1628" stroke="#334b70" stroke-width="1.5"/>
<rect x="280" y="420" width="300" height="130" rx="20" fill="#121f34" stroke="#3b82f6" stroke-width="1.5"/>
<text x="310" y="458" class="label">HUMAN ACCOUNTABILITY</text>
<text x="310" y="488" class="small">Member owns the work and</text><text x="310" y="512" class="small">makes governance decisions.</text>
<rect x="610" y="420" width="300" height="130" rx="20" fill="#121f34" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="640" y="458" class="label">EXPLICIT AUTHORIZATION</text>
<text x="640" y="488" class="small">Execution Grant + Collaboration</text><text x="640" y="512" class="small">Grant define Agent authority.</text>
<rect x="940" y="420" width="380" height="130" rx="20" fill="#121f34" stroke="#06b6d4" stroke-width="1.5"/>
<text x="970" y="458" class="label">CONTROLLED EXECUTION</text>
<text x="970" y="488" class="small">Agents contribute independently;</text><text x="970" y="512" class="small">they never own the Task outcome.</text>
</g>
<path d="M800 280V390" class="line"/>

<g>
<rect x="120" y="650" width="1360" height="150" rx="26" fill="url(#accent)" opacity=".12" stroke="#355a91"/>
<text x="160" y="692" class="label">06 · HUMAN ACCEPTANCE</text>
<text x="160" y="726" class="small">Review → Verify Evidence → Approve / Reject → Audit</text>
<circle cx="1040" cy="716" r="54" fill="#101e33" stroke="#f59e0b" stroke-width="2"/>
<text x="1008" y="710" class="small">AUDIT</text><text x="990" y="730" class="small">TRAIL</text>
<path d="M1320 550V650" class="line"/>
<path d="M1480 725H1400" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 7"/>
</g>
<text x="80" y="852" class="small">DAEP governs identity, authorization, work, collaboration, evidence, acceptance and audit — not Agent Runtime execution.</text>
</svg>