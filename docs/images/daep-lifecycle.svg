<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="t d">
<title id="t">DAEP engineering delivery lifecycle</title><desc id="d">Project becomes requirement, task, authorized agent work, evidence, review and human acceptance, with audit across the lifecycle.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
<rect width="1400" height="330" rx="28" fill="#0b1020"/>
<text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">From Intent to Accepted Delivery</text>
<text x="60" y="87" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94a3b8">The Agent can execute work. DAEP makes the result attributable, reviewable and governable.</text>
<g font-family="Inter,Arial,sans-serif">
<g font-size="15" font-weight="800" text-anchor="middle">
<g><circle cx="105" cy="190" r="46" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="105" y="186" fill="#fff">PROJECT</text><text x="105" y="207" fill="#93c5fd" font-size="11">intent</text></g>
<g><circle cx="315" cy="190" r="46" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="315" y="186" fill="#fff">REQUIREMENT</text><text x="315" y="207" fill="#93c5fd" font-size="11">criteria</text></g>
<g><circle cx="525" cy="190" r="46" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="525" y="186" fill="#fff">TASK</text><text x="525" y="207" fill="#a5b4fc" font-size="11">assignment</text></g>
<g><circle cx="735" cy="190" r="46" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="735" y="186" fill="#fff">AGENT</text><text x="735" y="207" fill="#c4b5fd" font-size="11">authorized work</text></g>
<g><circle cx="945" cy="190" r="46" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="945" y="186" fill="#fff">EVIDENCE</text><text x="945" y="207" fill="#67e8f9" font-size="11">artifact / commit</text></g>
<g><circle cx="1155" cy="190" r="46" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="1155" y="186" fill="#fff">ACCEPT</text><text x="1155" y="207" fill="#86efac" font-size="11">human decision</text></g>
</g>
<path d="M151 190H269 M361 190H479 M571 190H689 M781 190H899 M991 190H1109" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
<text x="700" y="275" text-anchor="middle" fill="#64748b" font-size="13">Audit, authorization and governance are cross-cutting controls — not a final step.</text>
</g>
</svg>