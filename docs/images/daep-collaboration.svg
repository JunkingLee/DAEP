<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#152b46"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs>
<rect width="1440" height="760" rx="32" fill="url(#bg)"/>
<text x="72" y="78" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="700">DAEP Multi-Agent Collaboration</text>
<text x="72" y="116" fill="#9fb3c8" font-family="Inter,Arial" font-size="18">Task-level collaboration with explicit ownership, grants, proposals and evidence</text>
<rect x="72" y="170" width="250" height="190" rx="22" fill="#10243a" stroke="#35516d"/><text x="98" y="210" fill="#fff" font-family="Inter,Arial" font-size="22" font-weight="700">Human Members</text>
<text x="98" y="248" fill="#b8c9d9" font-family="Inter,Arial" font-size="16">Own Agents</text><text x="98" y="278" fill="#b8c9d9" font-family="Inter,Arial" font-size="16">Authorize Grants</text><text x="98" y="308" fill="#b8c9d9" font-family="Inter,Arial" font-size="16">Review / Accept</text>
<rect x="410" y="150" width="620" height="510" rx="30" fill="#0c1b2c" stroke="#4b6b87" stroke-width="2"/><text x="450" y="200" fill="#fff" font-family="Inter,Arial" font-size="25" font-weight="700">Task + Collaboration Session</text>
<rect x="450" y="235" width="250" height="125" rx="18" fill="#132d43"/><text x="475" y="270" fill="#5eead4" font-family="Inter,Arial" font-size="18" font-weight="700">Agent A</text><text x="475" y="300" fill="#c7d5e3" font-family="Inter,Arial" font-size="15">Execution Grant</text><text x="475" y="326" fill="#c7d5e3" font-family="Inter,Arial" font-size="15">Work Package / Evidence</text>
<rect x="740" y="235" width="250" height="125" rx="18" fill="#132d43"/><text x="765" y="270" fill="#60a5fa" font-family="Inter,Arial" font-size="18" font-weight="700">Agent B</text><text x="765" y="300" fill="#c7d5e3" font-family="Inter,Arial" font-size="15">Collaboration Grant</text><text x="765" y="326" fill="#c7d5e3" font-family="Inter,Arial" font-size="15">Proposal / Help Request</text>
<rect x="450" y="395" width="540" height="105" rx="18" fill="#10243a"/><text x="475" y="432" fill="#fff" font-family="Inter,Arial" font-size="18" font-weight="700">Shared Context — governed, not autonomous</text><text x="475" y="464" fill="#b8c9d9" font-family="Inter,Arial" font-size="15">Messages • Proposals • Session state • Independent progress</text>
<rect x="450" y="530" width="540" height="95" rx="18" fill="#10243a"/><text x="475" y="566" fill="#fff" font-family="Inter,Arial" font-size="18" font-weight="700">Formal delivery path</text><text x="475" y="596" fill="#b8c9d9" font-family="Inter,Arial" font-size="15">Work Package → Evidence → Review → Human Acceptance</text>
<rect x="1110" y="170" width="260" height="190" rx="22" fill="#10243a" stroke="#35516d"/><text x="1136" y="210" fill="#fff" font-family="Inter,Arial" font-size="22" font-weight="700">Governance</text><text x="1136" y="248" fill="#b8c9d9" font-family="Inter,Arial" font-size="16">Policy</text><text x="1136" y="278" fill="#b8c9d9" font-family="Inter,Arial" font-size="16">Authorization</text><text x="1136" y="308" fill="#b8c9d9" font-family="Inter,Arial" font-size="16">Audit</text>
<path d="M322 265H410M1030 265H1110" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/><path d="M322 265l-14-9v18zM1110 265l14-9v18z" fill="#60a5fa"/>
<text x="72" y="710" fill="#7189a1" font-family="Inter,Arial" font-size="15">Presence enables discovery. Grants enable authorization. Proposals never replace human governance.</text>
