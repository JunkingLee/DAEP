d:#3974bd}.detailgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.small{font-size:12px}.filters{display:flex;gap:10px;max-width:540px;margin:10px 0}.risk{color:#b54708}.good{color:#13724a}.graphwrap{overflow:auto;border:1px solid #e8edf3;border-radius:9px;background:#fbfcfe;padding:8px}.depgraph{display:block;min-width:100%;height:auto}.graphnode{cursor:pointer}.graphnode rect{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}.graphnode:hover rect{stroke:#3974bd;stroke-width:2.2}.graphnode text{font-family:inherit;fill:#263548}.graphedge{fill:none;stroke:#94a3b8;stroke-width:1.7}.dep-link{display:inline-block;margin:3px 5px 3px 0;padding:5px 8px;border:1px solid #dce4ee;border-radius:6px;background:#f7f9fc;color:#2457a7;cursor:pointer}.hidden{display:none}@media(max-width:600px){header{padding:16px}main{margin:14px auto}}

/* RC26 UI Architecture: role-aware application shell */
:root{--daep-navy:#172b4d;--daep-blue:#2563eb;--daep-blue-soft:#eff6ff;--daep-border:#e5eaf0;--daep-bg:#f5f7fb;--daep-text:#182230;--daep-muted:#667085;--daep-good:#13724a;--daep-warn:#b54708;--daep-danger:#b42318}
body{background:var(--daep-bg);color:var(--daep-text)}
header{position:sticky;top:0;z-index:20;height:64px;padding:0 24px;background:#fff;color:var(--daep-text);border-bottom:1px solid var(--daep-border);box-shadow:0 1px 5px rgba(23,43,77,.06)}
header .brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.1px}
header .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800}
header .header-context{font-size:13px;color:var(--daep-muted);padding-left:10px;border-left:1px solid var(--daep-border)}
header .header-actions{display:flex;align-items:center;gap:10px}
header .identity-pill{padding:7px 10px;border:1px solid var(--daep-border);border-radius:999px;background:#f8fafc;color:#475467}
main{max-width:none;margin:0;padding:0}
#app.app-shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 64px)}
.daep-sidebar{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;background:var(--daep-navy);color:#d7e2f2;padding:18px 12px}
.daep-logo-sub{font-size:10px;opacity:.68;margin:2px 0 20px 42px}
.daep-nav-group{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8ea3c1;padding:0 10px}
.daep-nav{display:flex;flex-direction:column;gap:4px}
